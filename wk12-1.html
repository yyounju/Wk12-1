<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Little Story Friends - English Picture Book for Age 5</title>
  <style>
    :root {
      --bg-sky: #e0f7fa;
      --bg-cream: #fffdf7;
      --primary: #ff7043;
      --primary-dark: #e64a19;
      --secondary: #29b6f6;
      --secondary-dark: #0288d1;
      --accent: #ffca28;
      --green: #66bb6a;
      --text-main: #2d3436;
      --text-muted: #636e72;
      --card-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Nunito', 'Apple SD Gothic Neo', sans-serif;
      background: linear-gradient(180deg, #b3e5fc 0%, #fff9c4 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* App Container */
    .app-shell {
      width: 100%;
      max-width: 900px;
      min-height: 94vh;
      margin: 12px;
      background: var(--bg-cream);
      border-radius: 32px;
      box-shadow: var(--card-shadow);
      border: 6px solid #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Header Bar */
    header {
      background: #ffffff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px dashed #ffe082;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
      cursor: pointer;
    }

    .brand span.logo {
      font-size: 1.8rem;
      animation: bounce 2.5s infinite;
    }

    .controls-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill-btn {
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, background 0.2s;
      font-family: inherit;
    }

    .pill-btn:active {
      transform: scale(0.94);
    }

    .btn-home {
      background: #f1f2f6;
      color: var(--text-main);
    }

    .btn-speed {
      background: #e1f5fe;
      color: var(--secondary-dark);
    }

    .btn-korean {
      background: #fff3e0;
      color: #ef6c00;
    }

    .btn-korean.active {
      background: #ff9800;
      color: white;
    }

    /* Screens */
    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .screen.active {
      display: flex;
    }

    /* Library / Home Screen */
    .library-title {
      text-align: center;
      margin: 8px 0 4px;
      font-size: 1.8rem;
      color: var(--text-main);
    }

    .library-subtitle {
      text-align: center;
      margin: 0 0 22px;
      font-size: 1.05rem;
      color: var(--text-muted);
    }

    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      flex: 1;
      align-content: center;
    }

    .book-card {
      background: white;
      border-radius: 26px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      border: 4px solid transparent;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .book-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
    }

    .book-cover-art {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.5rem;
      margin-bottom: 14px;
      box-shadow: inset 0 -6px 0 rgba(0,0,0,0.08);
    }

    .book-card h3 {
      margin: 6px 0;
      font-size: 1.35rem;
      color: var(--text-main);
    }

    .book-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      background: #e8f5e9;
      color: #2e7d32;
      margin-bottom: 12px;
    }

    .star-badge {
      font-size: 1.2rem;
      color: #fbc02d;
      min-height: 26px;
    }

    /* Reader Screen */
    .progress-bar-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #dfe6e9;
      transition: all 0.25s ease;
    }

    .dot.active {
      background: var(--primary);
      transform: scale(1.25);
    }

    .dot.done {
      background: var(--green);
    }

    /* Interactive Illustration Stage */
    .stage {
      position: relative;
      width: 100%;
      height: 290px;
      border-radius: 26px;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.06);
      border: 4px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .stage-hint {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(255, 255, 255, 0.88);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      pointer-events: none;
    }

    .interactive-prop {
      position: absolute;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .interactive-prop:active {
      transform: scale(1.25) rotate(-5deg) !important;
    }

    .prop-emoji {
      font-size: 4.5rem;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.15));
      line-height: 1;
    }

    .prop-label {
      margin-top: 4px;
      background: rgba(255, 255, 255, 0.95);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      color: var(--secondary-dark);
      box-shadow: 0 3px 8px rgba(0,0,0,0.1);
      opacity: 0.95;
    }

    .prop-pop {
      animation: popWiggle 0.55s ease;
    }

    /* Story Text Box */
    .story-box {
      background: #ffffff;
      border-radius: 24px;
      padding: 18px 22px;
      text-align: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      border: 3px solid #ffe082;
      margin-bottom: 16px;
      min-height: 130px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .sentence-words {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.4;
    }

    .word-span {
      padding: 4px 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s, color 0.15s;
    }

    .word-span:hover {
      background: #fff8e1;
    }

    .word-span.speaking {
      background: var(--accent);
      color: #000;
      transform: scale(1.12);
    }

    .word-span.target-word {
      color: var(--primary-dark);
      text-decoration: underline wavy var(--accent) 3px;
    }

    .korean-hint {
      margin-top: 10px;
      font-size: 1.05rem;
      color: var(--text-muted);
      font-weight: 600;
      display: none;
    }

    .korean-hint.visible {
      display: block;
    }

    /* Bottom Navigation & Big Audio Controls */
    .reader-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
    }

    .big-btn {
      border: none;
      border-radius: 22px;
      padding: 14px 22px;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      box-shadow: 0 6px 0 rgba(0,0,0,0.15);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .big-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
    }

    .big-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-listen {
      background: var(--accent);
      color: #3e2723;
      flex: 1.4;
      font-size: 1.35rem;
    }

    .btn-echo {
      background: #e1bee7;
      color: #4a148c;
      flex: 1;
    }

    .btn-nav {
      background: var(--secondary);
      color: white;
      min-width: 110px;
    }

    .btn-next {
      background: var(--green);
      color: white;
      min-width: 120px;
    }

    /* Mini Quiz / Game Screen */
    .quiz-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .quiz-prompt-btn {
      background: var(--secondary);
      color: white;
      border: none;
      border-radius: 28px;
      padding: 16px 28px;
      font-size: 1.4rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--secondary-dark);
      margin: 12px 0 24px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: inherit;
    }

    .quiz-prompt-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--secondary-dark);
    }

    .quiz-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 650px;
    }

    .quiz-card {
      background: white;
      border: 5px solid #e0e0e0;
      border-radius: 24px;
      padding: 20px 10px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .quiz-card:hover {
      transform: scale(1.04);
      border-color: var(--secondary);
    }

    .quiz-card.correct {
      border-color: var(--green);
      background: #e8f5e9;
      animation: popWiggle 0.5s ease;
    }

    .quiz-card.wrong {
      border-color: #ef5350;
      background: #ffebee;
      animation: shake 0.4s ease;
    }

    .quiz-emoji {
      font-size: 4.2rem;
    }

    .quiz-word {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
    }

    /* Celebration Modal / Screen */
    .reward-box {
      text-align: center;
      margin: auto;
      padding: 20px;
    }

    .trophy {
      font-size: 6rem;
      animation: bounce 1.2s infinite;
    }

    /* Floating Feedback Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #323232;
      color: white;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 1.15rem;
      font-weight: 700;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 999;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes popWiggle {
      0% { transform: scale(1); }
      35% { transform: scale(1.28) rotate(8deg); }
      70% { transform: scale(1.15) rotate(-6deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .sentence-words { font-size: 1.55rem; gap: 6px; }
      .stage { height: 230px; }
      .prop-emoji { font-size: 3.6rem; }
      .quiz-options { grid-template-columns: 1fr; max-width: 300px; }
      .reader-controls { flex-wrap: wrap; }
      .btn-listen { order: -1; width: 100%; flex: auto; }
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- Top Bar -->
    <header>
      <div class="brand" onclick="goHome()">
        <span class="logo">🐻</span>
        <span>Little Story Friends</span>
      </div>
      <div class="controls-top">
        <button class="pill-btn btn-speed" id="speedBtn" onclick="toggleSpeed()">🐢 Slow</button>
        <button class="pill-btn btn-korean" id="koreanBtn" onclick="toggleKorean()">🇰🇷 뜻 보기</button>
        <button class="pill-btn btn-home" onclick="goHome()">📚 Books</button>
      </div>
    </header>

    <!-- 1. Book Selection Screen -->
    <section id="libraryScreen" class="screen active">
      <h1 class="library-title">Pick a Story Book! 📖</h1>
      <p class="library-subtitle">Tap a book to listen, touch the pictures, and play!</p>
      <div class="book-grid" id="bookGrid"></div>
    </section>

    <!-- 2. Picture Book Reader Screen -->
    <section id="readerScreen" class="screen">
      <div class="progress-bar-wrap" id="progressDots"></div>

      <!-- Interactive Illustration Stage -->
      <div class="stage" id="storyStage">
        <div class="stage-hint">👆 Touch the pictures!</div>
      </div>

      <!-- Sentence Box with Karaoke Highlight -->
      <div class="story-box">
        <div class="sentence-words" id="sentenceWords"></div>
        <div class="korean-hint" id="koreanHint"></div>
      </div>

      <!-- Child-Friendly Controls -->
      <div class="reader-controls">
        <button class="big-btn btn-nav" id="prevBtn" onclick="prevPage()">⬅️ Back</button>
        <button class="big-btn btn-listen" id="listenBtn" onclick="readCurrentPage()">🔊 Read to Me</button>
        <button class="big-btn btn-echo" id="echoBtn" onclick="practiceSayIt()">🎤 Say It!</button>
        <button class="big-btn btn-next" id="nextBtn" onclick="nextPage()">Next ➡️</button>
      </div>
    </section>

    <!-- 3. Listen & Find Mini-Game Screen -->
    <section id="quizScreen" class="screen">
      <div class="quiz-container">
        <h2 style="font-size: 1.7rem; margin: 0;">🎉 Story Game Time!</h2>
        <p style="color: var(--text-muted); margin: 6px 0;">Listen carefully and tap the right picture!</p>
        <button class="quiz-prompt-btn" onclick="speakQuizPrompt()">
          <span>🔊</span>
          <span id="quizPromptText">Find the ...</span>
        </button>
        <div class="quiz-options" id="quizOptions"></div>
      </div>
    </section>

    <!-- 4. Star Reward Screen -->
    <section id="rewardScreen" class="screen">
      <div class="reward-box">
        <div class="trophy">🌟</div>
        <h1 style="font-size: 2.2rem; color: var(--primary); margin: 10px 0;">Great Job, Reader!</h1>
        <p style="font-size: 1.25rem; color: var(--text-muted);" id="rewardMessage">You finished the book!</p>
        <div style="margin-top: 28px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
          <button class="big-btn btn-listen" onclick="restartBook()">🔄 Read Again</button>
          <button class="big-btn btn-next" onclick="goHome()">📚 More Books</button>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast">Great job!</div>

  <script>
    // ==========================================
    // 1. EFL Age-5 Picture Book Curriculum Data
    // Repetitive sentence frames + concrete nouns
    // ==========================================
    const BOOKS = [
      {
        id: 'colors',
        title: 'What Color Is It?',
        tag: 'Colors & Nature',
        coverEmoji: '🌈',
        coverBg: '#fff3e0',
        pages: [
          {
            bg: 'linear-gradient(180deg, #b3e5fc 0%, #c8e6c9 100%)',
            sentence: ['I', 'see', 'a', 'red', 'apple.'],
            targetIndex: 3,

              { emoji: '🌳', word: 'tree', x: 18, y: 22, sound: 'A green tree!' },
              { emoji: '🍎', word: 'red apple', x: 52, y: 36, sound: 'Yum! A red apple!' },

            ]

          {

      },
      {
        id: 'animals',

          {

          },

            targetIndex: 1,
            korean: '안녕, 고양이야! 야옹!',

          {
            prompt: 'Who says Moo, moo? Find the cow!',
            answer: 'cow',
            options: [
              { emoji: '🐷', label: 'pig' },
              { emoji: '🐮', label: 'cow' },
              { emoji: '🐱', label: 'cat' }
            ]
          },
          {
            prompt: 'Who says Woof, woof? Find the dog!',
            answer: 'dog',
            options: [
              { emoji: '🐶', label: 'dog' },
              { emoji: '🐮', label: 'cow' },
              { emoji: '🐷', label: 'pig' }
            ]
          }
        ]
      },
      {
        id: 'actions',
        title: 'I Can Jump!',
        tag: 'Action Verbs',
        coverEmoji: '🐰',
        coverBg: '#e1f5fe',
        pages: [
          {
            bg: 'linear-gradient(180deg, #e0f2f1 0%, #b2ebf2 100%)',
            sentence: ['I', 'can', 'jump', 'up', 'high!'],
            targetIndex: 2,
            korean: '나는 높이 점프할 수 있어요!',
            props: [
              { emoji: '🐰', word: 'jump', x: 46, y: 30, sound: 'Boing! Jump, bunny, jump!' },
              { emoji: '🥕', word: 'carrot', x: 76, y: 52, sound: 'Crunchy carrot!' },
              { emoji: '☁️', word: 'sky', x: 20, y: 14, sound: 'Up in the sky!' }
            ]
          },
          {
            bg: 'linear-gradient(180deg, #fffde7 0%, #fff59d 100%)',
            sentence: ['I', 'can', 'run', 'so', 'fast!'],
            targetIndex: 2,
            korean: '나는 아주 빨리 달릴 수 있어요!',
            props: [
              { emoji: '🐆', word: 'run', x: 46, y: 36, sound: 'Zoom! Run, run, run!' },
              { emoji: '👟', word: 'shoes', x: 20, y: 52, sound: 'Fast shoes!' },
              { emoji: '🏁', word: 'finish', x: 78, y: 36, sound: 'Go, go, go!' }
            ]
          },
          {
            bg: 'linear-gradient(180deg, #b3e5fc 0%, #81d4fa 100%)',
            sentence: ['I', 'can', 'swim', 'in', 'water!'],
            targetIndex: 2,
            korean: '나는 물에서 수영할 수 있어요!',
            props: [
              { emoji: '🐢', word: 'swim', x: 46, y: 38, sound: 'Splash! Swim, turtle, swim!' },
              { emoji: '🐙', word: 'octopus', x: 76, y: 46, sound: 'Wiggle octopus!' },
              { emoji: '🫧', word: 'bubbles', x: 22, y: 26, sound: 'Pop! Bubbles!' }
            ]
          },
          {
            bg: 'linear-gradient(180deg, #3f51b5 0%, #1a237e 100%)',
            sentence: ['I', 'can', 'sleep', 'at', 'night.'],
            targetIndex: 2,
            korean: '나는 밤에 잘 수 있어요.',
            props: [
              { emoji: '🐻', word: 'sleep', x: 46, y: 38, sound: 'Shhh... Good night, bear!' },
              { emoji: '🌙', word: 'moon', x: 78, y: 15, sound: 'Sleepy moon!' },
              { emoji: '⭐', word: 'star', x: 22, y: 18, sound: 'Twinkle star!' }
            ]
          }
        ],
        quiz: [
          {
            prompt: 'Find who can jump!',
            answer: 'jump',
            options: [
              { emoji: '🐰', label: 'jump' },
              { emoji: '🐢', label: 'swim' },
              { emoji: '🐻', label: 'sleep' }
            ]
          },
          {
            prompt: 'Find who can sleep!',
            answer: 'sleep',
            options: [
              { emoji: '🐆', label: 'run' },
              { emoji: '🐻', label: 'sleep' },
              { emoji: '🐰', label: 'jump' }
            ]
          }
        ]
      }
    ];

    // ==========================================
    // 2. App State & Persistence
    // ==========================================
    let currentBook = null;
    let currentPageIndex = 0;
    let currentQuizIndex = 0;
    let isSlowMode = true; // Default slow for 5-year-old EFL learners
    let showKorean = false;
    let completedBooks = JSON.parse(localStorage.getItem('lsf_stars') || '{}');
    let preferredVoice = null;

    // ==========================================
    // 3. Speech Synthesis (Child-Friendly TTS)
    // ==========================================
    function loadVoices() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      // Prefer warm female English voices if available
      preferredVoice =
        voices.find(v => v.lang.startsWith('en') && (v.name.includes('Samantha') || v.name.includes('Google US English') || v.name.includes('Female') || v.name.includes('Zira'))) ||
        voices.find(v => v.lang.startsWith('en-US')) ||
        voices.find(v => v.lang.startsWith('en'));
    }

    if ('speechSynthesis' in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakText(text, options = {}) {
      if (!('speechSynthesis' in window)) {
        showToast(text);
        return;
      }
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      if (preferredVoice) utter.voice = preferredVoice;
      utter.lang = 'en-US';
      utter.rate = options.rate || (isSlowMode ? 0.72 : 0.92);
      utter.pitch = options.pitch || 1.15; // Slightly higher, friendly tone for kids

      if (options.onBoundary) utter.onboundary = options.onBoundary;
      if (options.onEnd) utter.onend = options.onEnd;

      window.speechSynthesis.speak(utter);
    }

    // Gentle Web Audio Sound Effects (Pop, Ding, Fanfare)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type = 'sine', duration = 0.15) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playSuccessChime() {
      playTone(523.25, 'triangle', 0.14);
      setTimeout(() => playTone(659.25, 'triangle', 0.14), 110);
      setTimeout(() => playTone(783.99, 'triangle', 0.25), 220);
    }

    function playPopSound() {
      playTone(420, 'sine', 0.09);
    }

    // ==========================================
    // 4. Screen Navigation & Library Rendering
    // ==========================================
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function renderLibrary() {
      const grid = document.getElementById('bookGrid');
      grid.innerHTML = '';

      BOOKS.forEach(book => {
        const stars = completedBooks[book.id] || 0;
        const starDisplay = stars > 0 ? '⭐'.repeat(Math.min(stars, 3)) : '☆ Tap to Read';

        const card = document.createElement('div');
        card.className = 'book-card';
        card.innerHTML = `
          <div class="book-cover-art" style="background:${book.coverBg}">${book.coverEmoji}</div>
          <span class="book-tag">${book.tag}</span>
          <h3>${book.title}</h3>
          <div class="star-badge">${starDisplay}</div>
        `;
        card.onclick = () => openBook(book.id);
        grid.appendChild(card);
      });
    }

    function goHome() {
      window.speechSynthesis && window.speechSynthesis.cancel();
      renderLibrary();
      showScreen('libraryScreen');
    }

    function toggleSpeed() {
      isSlowMode = !isSlowMode;
      const btn = document.getElementById('speedBtn');
      btn.textContent = isSlowMode ? '🐢 Slow' : '🐇 Normal';
      showToast(isSlowMode ? 'Slow & clear voice!' : 'Normal speed voice!');
    }

    function toggleKorean() {
      showKorean = !showKorean;
      const btn = document.getElementById('koreanBtn');
      btn.classList.toggle('active', showKorean);
      const hint = document.getElementById('koreanHint');
      if (hint) hint.classList.toggle('visible', showKorean);
    }

    // ==========================================
    // 5. Picture Book Reader Logic
    // ==========================================
    function openBook(bookId) {
      currentBook = BOOKS.find(b => b.id === bookId);
      currentPageIndex = 0;
      showScreen('readerScreen');
      renderPage();
    }

    function restartBook() {
      currentPageIndex = 0;
      showScreen('readerScreen');
      renderPage();
    }

    function renderPage() {
      const page = currentBook.pages[currentPageIndex];

      // 1. Progress Dots
      const dotsWrap = document.getElementById('progressDots');
      dotsWrap.innerHTML = '';
      currentBook.pages.forEach((_, idx) => {
        const dot = document.createElement('div');
        dot.className = 'dot' + (idx === currentPageIndex ? ' active' : idx < currentPageIndex ? ' done' : '');
        dotsWrap.appendChild(dot);
      });

      // 2. Interactive Stage
      const stage = document.getElementById('storyStage');
      stage.style.background = page.bg;
      stage.innerHTML = '<div class="stage-hint">👆 Touch the pictures!</div>';

      page.props.forEach(prop => {
        const el = document.createElement('div');
        el.className = 'interactive-prop';
        el.style.left = prop.x + '%';
        el.style.top = prop.y + '%';
        el.style.transform = 'translate(-50%, -20%)';
        el.innerHTML = `
          <div class="prop-emoji">${prop.emoji.replace('mud ', '')}</div>
          <div class="prop-label">${prop.word}</div>
        `;
        el.onclick = () => {
          playPopSound();
          el.classList.remove('prop-pop');
          void el.offsetWidth; // trigger reflow
          el.classList.add('prop-pop');
          speakText(prop.sound);
        };
        stage.appendChild(el);
      });

      // 3. Sentence with Clickable Individual Words
      const wordsWrap = document.getElementById('sentenceWords');
      wordsWrap.innerHTML = '';
      page.sentence.forEach((word, idx) => {
        const span = document.createElement('span');
        span.className = 'word-span' + (idx === page.targetIndex ? ' target-word' : '');
        span.textContent = word;
        span.dataset.idx = idx;
        span.onclick = () => {
          highlightWord(idx);
          speakText(word.replace(/[.,!?]/g, ''));
          setTimeout(() => clearHighlights(), 650);
        };
        wordsWrap.appendChild(span);
      });

      // 4. Korean Support Subtitle
      const koreanHint = document.getElementById('koreanHint');
      koreanHint.textContent = page.korean;
      koreanHint.classList.toggle('visible', showKorean);

      // 5. Navigation Buttons
      document.getElementById('prevBtn').disabled = currentPageIndex === 0;
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.textContent = currentPageIndex === currentBook.pages.length - 1 ? 'Play Game 🎮' : 'Next ➡️';

      // Auto-read page gently after short delay
      setTimeout(() => readCurrentPage(), 350);
    }

    function highlightWord(index) {
      clearHighlights();
      const spans = document.querySelectorAll('.word-span');
      if (spans[index]) spans[index].classList.add('speaking');
    }

    function clearHighlights() {
      document.querySelectorAll('.word-span').forEach(s => s.classList.remove('speaking'));
    }

    function readCurrentPage() {
      const page = currentBook.pages[currentPageIndex];
      const fullSentence = page.sentence.join(' ');
      const spans = document.querySelectorAll('.word-span');

      // Fallback timer-based karaoke highlight synchronized to speech length
      let wordIdx = 0;
      clearHighlights();
      if (spans[0]) spans[0].classList.add('speaking');

      const stepMs = isSlowMode ? 520 : 380;
      const interval = setInterval(() => {
        wordIdx++;
        if (wordIdx < spans.length) {
          highlightWord(wordIdx);
        } else {
          clearInterval(interval);
        }
      }, stepMs);

      speakText(fullSentence, {
        onEnd: () => {
          clearInterval(interval);
          clearHighlights();
        }
      });
    }

    // Echo Reading ("My turn -> Your turn!") for 5-year-old confidence
    function practiceSayIt() {
      const page = currentBook.pages[currentPageIndex];
      const fullSentence = page.sentence.join(' ');
      showToast('👂 Listen first...');
      speakText('Your turn! ' + fullSentence, {
        onEnd: () => {
          showToast('🎤 Now YOU say it out loud!');
          playSuccessChime();
        }
      });
    }

    function prevPage() {
      if (currentPageIndex > 0) {
        currentPageIndex--;
        renderPage();
      }
    }

    function nextPage() {
      if (currentPageIndex < currentBook.pages.length - 1) {
        currentPageIndex++;
        renderPage();
      } else {
        startQuiz();
      }
    }

    // ==========================================
    // 6. Listen & Tap Comprehension Game
    // ==========================================
    function startQuiz() {
      currentQuizIndex = 0;
      showScreen('quizScreen');
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const q = currentBook.quiz[currentQuizIndex];
      document.getElementById('quizPromptText').textContent = q.prompt;

      const optionsWrap = document.getElementById('quizOptions');
      optionsWrap.innerHTML = '';

      q.options.forEach(opt => {
        const card = document.createElement('div');
        card.className = 'quiz-card';
        card.innerHTML = `
          <div class="quiz-emoji">${opt.emoji}</div>
          <div class="quiz-word">${opt.label}</div>
        `;
        card.onclick = () => handleQuizAnswer(card, opt.label === q.answer, opt.label);
        optionsWrap.appendChild(card);
      });

      setTimeout(() => speakQuizPrompt(), 300);
    }

    function speakQuizPrompt() {
      const q = currentBook.quiz[currentQuizIndex];
      speakText(q.prompt);
    }

    function handleQuizAnswer(cardEl, isCorrect, label) {
      if (isCorrect) {
        cardEl.classList.add('correct');
        playSuccessChime();
        speakText('Yay! ' + label + '! Great job!');
        setTimeout(() => {
          currentQuizIndex++;
          if (currentQuizIndex < currentBook.quiz.length) {
            renderQuizQuestion();
          } else {
            finishBook();
          }
        }, 1400);
      } else {
        cardEl.classList.add('wrong');
        playTone(220, 'sawtooth', 0.2);
        speakText('Oops, that is ' + label + '. Try again!');
        setTimeout(() => cardEl.classList.remove('wrong'), 600);
      }
    }

    function finishBook() {
      completedBooks[currentBook.id] = (completedBooks[currentBook.id] || 0) + 1;
      localStorage.setItem('lsf_stars', JSON.stringify(completedBooks));
      document.getElementById('rewardMessage').textContent = `You earned a gold star for "${currentBook.title}"!`;
      showScreen('rewardScreen');
      playSuccessChime();
      speakText('Hooray! You finished the story! You are a superstar!');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // Initialize App
    renderLibrary();
  </script>
